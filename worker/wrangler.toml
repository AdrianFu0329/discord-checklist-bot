name = "discord-checklist-bot"
main = "src/index.js"
# Ed25519 in WebCrypto requires a reasonably recent compatibility date.
compatibility_date = "2025-04-01"

[vars]
# Ping messages go here. Leave empty to ping in whatever channel the checklist
# is in.
PING_CHANNEL_ID = "1533134289586229493"
# Channel the weekly checklist auto-posts to.
AUTOPOST_CHANNEL_ID = "1533398389314551860"

# Checklist state. Created with:
#   npx wrangler kv namespace create CHECKLIST
[[kv_namespaces]]
binding = "CHECKLIST"
id = "a4b82201727d4f59a763c6d9fc709507"

# Workers cron is UTC. Friday 00:00 Asia/Kuala_Lumpur (UTC+8) is the preceding
# Thursday at 16:00 UTC, hence a Thursday day-of-week here.
[triggers]
crons = ["0 16 * * 4"]
