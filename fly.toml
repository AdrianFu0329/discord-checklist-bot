# fly.toml app configuration file generated for discord-checklist-bot on 2026-09-02T09:39:11+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

# A Discord bot is a long-lived outbound gateway connection, not a web service.
# Hence no [http_service] and no exposed ports: nothing should reach it from
# outside, and it must never scale to zero or the gateway connection dies.
app = 'discord-checklist-bot'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'

# One machine only. A second would open a competing gateway session on the same
# token, racing for the same button clicks.
[processes]
  app = 'node index.js'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
